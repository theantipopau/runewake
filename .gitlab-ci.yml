image: eclipse-temurin:8-jdk

before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes ant curl python3

stages:
  - verify
  - build
  - upload

themeGuard:
  stage: verify
  script:
    - bash scripts/check_theme_literals.sh

dependencyGuard:
  stage: verify
  script:
    - bash scripts/check_dependencies.sh

hostingConfigGuard:
  stage: verify
  script:
    # bash -n takes one script; extra args become $1 and are never parsed,
    # so every script gets its own invocation here.
    - |
      status=0
      for f in scripts/*.sh; do
        bash -n "$f" || status=1
      done
      [ "$status" -eq 0 ] || exit 1
    - bash scripts/check_hosting_config.sh

# Gitleaks over the full history, filtered by the reviewed redacted baseline.
# Mirrors the GitHub secret-scan job; see SECURITY.md for the policy.
secretScan:
  stage: verify
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get --quiet update --yes
    - apt-get --quiet install --yes curl
    - curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
    - mkdir -p /tmp/gitleaks-bin
    - tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks-bin gitleaks
    - mv /tmp/gitleaks-bin/gitleaks /usr/local/bin/gitleaks
    - gitleaks version
  script:
    - gitleaks git . -c .gitleaks.toml -b .gitleaks.baseline.json --redact --no-banner

themeParityGuard:
  stage: build
  script:
    - bash -n scripts/check_theme_parity.sh
    - cd Client_Base && ant compile && cd ../
    - bash scripts/check_theme_parity.sh

# Boots the world on SQLite and asserts /healthz, /status and /metrics.
# Compile-clean is not enough: a runtime-only dependency gap (the missing
# commons-io after the commons-compress bump) only shows up at world load.
bootSmoke:
  stage: build
  script:
    - bash -n scripts/check_boot.sh
    - cd server && ant compile_core && ant compile_plugins && cd ../
    - bash scripts/check_boot.sh

pagesBuild:
  stage: verify
  script:
    - bash scripts/build_pages.sh

build:
  stage: build
  script:
    - cd server && ant compile_core && ant compile_plugins && cd ../
    - cd Client_Base && ant compile && cd ../
    - cd PC_Launcher && ant compile && cd ../
  artifacts:
    paths:
      - PC_Launcher/OpenRSC.jar
    when: on_success
    expose_as: 'OpenRSC jar'  # (Optional) provides a direct download link in the job UI

launcherUpload:
  stage: upload
  script:
    - echo "Uploading OpenRSC.jar"
  needs:
    - build
  artifacts:
    paths:
      - PC_Launcher/OpenRSC.jar
      - PC_Launcher/vet.rsc.OpenRSC.Launcher.appdata.xml
    when: on_success
