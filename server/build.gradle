plugins {
    id "application"
    id "java"
}

group "org.openrsc"
version "0.1.1"

application {
    mainClassName = "com.openrsc.server.Server"
    applicationDefaultJvmArgs = ['-DcoloredLogging=true','-Dconf=default']
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs "src"
            srcDirs "plugins"
        }
    }
}

dependencies {
    // RuneWake vendors its runtime jars under server/lib instead of resolving them
    // from a repository. Keep every version below aligned with the vendored
    // filename so the Gradle and Ant builds cannot drift; see docs/DEPENDENCIES.md.
    implementation files("lib/JDA-4.0.0_55-withDependencies.jar")

    // Discord
    implementation "com.vdurmont:emoji-java:5.1.1"
    implementation "org.gitlab4j:gitlab4j-api:4.12.17"

    // Others
    implementation group: 'mysql', name: 'mysql-connector-j', version: '9.4.0'
//    implementation "org.mariadb.jdbc:mariadb-java-client:2.1.2"
    implementation "org.xerial:sqlite-jdbc:3.50.3.0"

    implementation "com.thoughtworks.xstream:xstream:1.4.21"
    implementation "com.lmax:disruptor:3.4.4"

    implementation "org.apache.commons:commons-collections4:4.5.0"
    implementation "org.apache.commons:commons-lang3:3.18.0"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "commons-lang:commons-lang:2.6"

    implementation("org.apache.logging.log4j:log4j-api:2.25.2")
    implementation("org.apache.logging.log4j:log4j-core:2.25.2")
    implementation("org.apache.logging.log4j:log4j-iostreams:2.25.2")
    implementation("org.apache.logging.log4j:log4j-slf4j-impl:2.25.2")

    implementation("org.json:json:20250517")
    implementation("commons-codec:commons-codec:1.19.0")
    implementation("xpp3:xpp3:1.1.4c")
    implementation("com.google.guava:guava:33.4.8-jre")
    implementation("com.google.inject:guice:5.0.2")
    implementation("io.netty:netty-all:4.1.67.Final")

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
}

ant.importBuild("build.xml")

run {
    dependsOn compile_plugins
}

test {
    useJUnitPlatform()
}
